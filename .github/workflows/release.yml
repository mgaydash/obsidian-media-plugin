name: Release Obsidian plugin

on:
    push:
        tags:
            - '*'

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
            attestations: write
        steps:
            - uses: actions/checkout@v6

            - name: Use Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: 24
                  cache: 'npm'

            - name: Check the tag matches the versions
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  for file in manifest.json package.json; do
                      version="$(node -p "require('./$file').version")"
                      if [ "$version" != "$tag" ]; then
                          echo "::error::Tag $tag does not match $file version $version. Tag the commit that bumped the version."
                          exit 1
                      fi
                  done
                  node -e "const v=require('./versions.json'); if (!(process.argv[1] in v)) { console.error('::error::versions.json has no entry for ' + process.argv[1]); process.exit(1); }" "$tag"

            - name: Extract release notes
              run: |
                  tag="${GITHUB_REF#refs/tags/}"
                  awk -v ver="$tag" '
                      /^## / { if (found) exit; if ($2 == ver) { found = 1; next } }
                      found { print }
                  ' CHANGELOG.md > release-notes.md
                  if [ -z "$(tr -d '[:space:]' < release-notes.md)" ]; then
                      echo "::error::CHANGELOG.md has no notes under '## $tag'."
                      exit 1
                  fi
                  cat release-notes.md

            - name: Build plugin
              run: |
                  npm ci
                  npm run build

            - name: Check for optional styles
              id: styles
              run: |
                  [ -f styles.css ] && echo "exists=true" >> "$GITHUB_OUTPUT" || echo "exists=false" >> "$GITHUB_OUTPUT"

            - name: Attest build provenance
              uses: actions/attest@v4
              with:
                  subject-path: |
                      main.js
                      ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}

            - name: Create release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  tag="${GITHUB_REF#refs/tags/}"

                  gh release create "$tag" \
                    --title="$tag" \
                    --notes-file=release-notes.md \
                    --draft \
                    main.js manifest.json ${{ steps.styles.outputs.exists == 'true' && 'styles.css' || '' }}
